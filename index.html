<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>LLM Narrative</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; }
    .box { border: 1px solid #ddd; padding: 12px; border-radius: 10px; }
    .cursor { display:inline-block; width:10px; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="box">
    <div id="text"></div><span class="cursor">▍</span>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const msg = params.get("msg") ||
      "Status: Normal. CO₂ stable. PM2.5 low. Predicted alarm probability is 0.12. No action needed.";

    const el = document.getElementById("text");
    let i = 0;

    function type() {
      el.textContent = msg.slice(0, i++);
      if (i <= msg.length) setTimeout(type, 18); // typing speed
    }
    type();
  </script>
</body>
</html>
