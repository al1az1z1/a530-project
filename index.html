<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gemini LLM Narrative</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #e8f5e9; /* light green */
    }

    .box {
      background-color: #ffffff;
      border-radius: 15px;
      padding: 20px;
      max-width: 600px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-left: 6px solid #43a047;
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #2e7d32;
    }

    .robot {
      font-size: 28px;
      margin-right: 8px;
    }

    #text {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      white-space: pre-line;
    }

    .cursor {
      display:inline-block;
      width:10px;
      animation: blink 1s step-end infinite;
      color: #2e7d32;
    }

    @keyframes blink { 
      50% { opacity: 0; } 
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="header">
      <span class="robot">🤖</span>
      Gemini Monitoring Assistant
    </div>

    <div id="text"></div><span class="cursor">▍</span>
  </div>

  <script>
    const msg = `Hi,

At 07:12:16 AM (Pacific), your place readings show very cold temperature (-20.85°C) and very dry air (12.76% humidity).

The 5-minute forecast suggests temperature may rise to -13.02°C and humidity to 13.79%, which is a small improvement but still cold and dry.

The estimated alarm probability is 8.95%, which indicates low risk right now.

Recommendation: Continue monitoring; if conditions change quickly, increase ventilation and check the sensor environment.`;

    const el = document.getElementById("text");
    let i = 0;

    function type() {
      el.textContent = msg.slice(0, i++);
      if (i <= msg.length) setTimeout(type, 18);
    }

    type();
  </script>

</body>
</html>
